[project]
name = "fastapi-rest-projet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TYSON2006", email = "knangoruffintyson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "async>=0.6.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.6",
    "loguru>=0.7.3",
    "pg>=0.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.0",
]

[project.scripts]
fastapi-rest-projet = "fastapi_rest_projet:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
